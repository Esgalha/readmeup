<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadmeUp</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px 16px;
        width: 220px;
        color: #24292f;
        background: #ffffff;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .version {
        font-size: 11px;
        color: #57606a;
        margin: 0 0 12px;
      }
      .platforms {
        font-size: 12px;
        color: #57606a;
        margin: 0 0 12px;
      }
      a {
        color: #0969da;
        text-decoration: none;
        font-size: 12px;
      }
      a:hover {
        text-decoration: underline;
      }
      .divider {
        border: none;
        border-top: 1px solid #d0d7de;
        margin: 10px 0;
      }
      .repo-label {
        font-size: 11px;
        color: #57606a;
        margin: 0 0 6px;
        word-break: break-all;
      }
      .toggle-btn {
        width: 100%;
        padding: 5px 0;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        color: #24292f;
      }
      .toggle-btn:hover {
        background: #eaeef2;
      }
    </style>
  </head>
  <body>
    <h1>ReadmeUp</h1>
    <p class="version" id="version">v1.0.0</p>
    <p class="platforms">Active on GitHub, GitLab &amp; Bitbucket</p>
    <a href="https://github.com/Esgalha/readmeup" target="_blank">View on GitHub</a>
    <div id="repo-controls" style="display: none">
      <hr class="divider" />
      <p class="repo-label" id="repo-label"></p>
      <button class="toggle-btn" id="toggle-btn"></button>
    </div>
    <script src="popup.ts" type="module"></script>
  </body>
</html>
